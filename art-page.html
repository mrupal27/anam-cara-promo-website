<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam Cara - Art Gallery</title>

  <link rel="stylesheet" href="site.css">

  <!--Defer means the HTML loads before the gallery script runs-->
  <script src="art-gallery.js" defer></script>
</head>

<body class="art-page inner-page">

  <!--Fixed home button remains visible whilst scrolling-->
  <nav class="page-navigation" aria-label="Page navigation">

    <a href="home-page.html" class="home-button">

      <img src="assets/home-icon.png" alt="">

      <span class="visually-hidden">
        Return to the home page
      </span>

    </a>

  </nav>

  <div class="page-shell">

    <header class="site-header">

      <div class="brand">

        <img
          class="brand-logo"
          src="assets/AnamCaraLogo.png"
          alt="Anam Cara logo"
        >

        <p class="brand-title">Anam Cara</p>

      </div>

    </header>

    <main>

      <h1 class="page-heading">Art Gallery</h1>

      <p class="page-description">
        Explore the visual development of Anam Cara, from early character
        sketches to promotional artwork. Select an image to view it larger.
      </p>

      <!--Character Concept Art-->
      <section class="art-section" aria-labelledby="character-concept-heading">

        <h2 id="character-concept-heading">Character Concept Art</h2>

        <div class="gallery-row">

          <img src="assets/cconcept1.png" alt="Character Concept Art 1">
          <img src="assets/cconcept2.png" alt="Character Concept Art 2">
          <img src="assets/cconcept3.png" alt="Character Concept Art 3">
          <img src="assets/cconcept4.png" alt="Character Concept Art 4">
          <img src="assets/cconcept5.png" alt="Character Concept Art 5">

        </div>

      </section>

      <!--Character Illustrations-->
      <section class="art-section" aria-labelledby="illustrations-heading">

        <h2 id="illustrations-heading">Character Illustrations</h2>

        <div class="gallery-row">

          <img src="assets/illustration1.png" alt="Character Illustration 1">
          <img src="assets/illustration2.png" alt="Character Illustration 2">
          <img src="assets/illustration3.png" alt="Character Illustration 3">
          <img src="assets/illustration4.png" alt="Character Illustration 4">
          <img src="assets/illustration5.png" alt="Character Illustration 5">

        </div>

      </section>

      <!--Monster Concept Art-->
      <section class="art-section" aria-labelledby="monster-concept-heading">

        <h2 id="monster-concept-heading">Monster Concept Art</h2>

        <div class="gallery-row">

          <img src="assets/mconcept1.png" alt="Monster Concept Art 1">
          <img src="assets/mconcept2.png" alt="Monster Concept Art 2">
          <img src="assets/mconcept3.png" alt="Monster Concept Art 3">
          <img src="assets/mconcept4.png" alt="Monster Concept Art 4">
          <img src="assets/mconcept5.png" alt="Monster Concept Art 5">

        </div>

      </section>

      <!--Game Posters-->
      <section class="art-section" aria-labelledby="posters-heading">

        <h2 id="posters-heading">Game Posters</h2>

        <div class="gallery-row">

          <img src="assets/gp1.png" alt="Game Poster 1">
          <img src="assets/gp2.png" alt="Game Poster 2">
          <img src="assets/gp3.png" alt="Game Poster 3">

        </div>

      </section>

      <!--Marketing Art-->
      <section class="art-section" aria-labelledby="marketing-heading">

        <h2 id="marketing-heading">Marketing Art</h2>

        <div class="gallery-row">

          <img src="assets/marketing1.png" alt="Marketing Art 1">
          <img src="assets/marketing2.png" alt="Marketing Art 2">
          <img src="assets/marketing3.png" alt="Marketing Art 3">
          <img src="assets/marketing4.png" alt="Marketing Art 4">
          <img src="assets/marketing5.png" alt="Marketing Art 5">

        </div>

      </section>

    </main>

  </div>

  <!--Hidden lightbox appears when an artwork is clicked-->
  <div
    class="lightbox"
    id="lightbox"
    aria-hidden="true"
    hidden
  >

    <div
      class="lightbox-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lightbox-caption"
    >

      <button
        class="lightbox-close"
        id="lightbox-close"
        type="button"
        aria-label="Close enlarged image"
      >
        &times;
      </button>

      <img id="lightbox-image" src="" alt="">

      <p id="lightbox-caption"></p>

    </div>

  </div>

</body>

</html>
